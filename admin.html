<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>輪值人員初評 - 管理儀表板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    :root { --sea: #497AB7; --ice: #F0F4F8; --regatta: #2D3E4E; }
    body { background-color: var(--ice); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--regatta); }
    .container-fluid { max-width: 1300px; padding-top: 20px; padding-bottom: 60px; }
    .header-section { background: linear-gradient(135deg, var(--sea), #35639C); color: white; padding: 25px 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    .nav-tabs .nav-link.active { background: var(--sea); color: white; border-color: var(--sea); }
    .nav-tabs .nav-link { color: var(--regatta); font-weight: 600; }
    table { font-size: 0.85rem; }
    thead th { background: #E1EBF5; color: #33547A; position: sticky; top: 0; }
    .table-wrap { max-height: 70vh; overflow: auto; background: white; border-radius: 12px; padding: 10px; }
    .section-label { font-weight: 700; margin: 20px 0 10px; color: var(--sea); }
    .step-box { max-width: 450px; margin: 60px auto; background: white; padding: 40px 30px; border-radius: 20px; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="header-section">
    <h3 id="pageTitle">輪值人員初評 - 管理儀表板</h3>
  </div>

  <div id="loadingBox" class="step-box">
    <div class="spinner-border text-primary mb-3"></div>
    <p>正在驗證身分...</p>
  </div>

  <div id="errorBox" class="step-box hidden">
    <h4 class="text-danger mb-3">連結無效或權限不足</h4>
    <p>請確認您使用的連結是否正確，如有疑問請聯繫系統管理員。</p>
  </div>

  <div id="mainBox" class="hidden">
    <ul class="nav nav-tabs mb-3" id="periodTabs"></ul>
    <div id="content">
      <div class="section-label">綜合評分結果</div>
      <div class="table-wrap mb-4"><table class="table table-sm table-bordered" id="summaryTable"></table></div>

      <div class="section-label">5位主任評分對照表（評分標準校準用）</div>
      <div class="table-wrap"><table class="table table-sm table-bordered" id="comparisonTable"></table></div>
    </div>
  </div>
</div>

<script>
  // 部署 Apps Script 後，把「網頁應用程式網址」貼在這裡（與 index.html 共用同一支 API_URL）
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbWRQBQA8YecfCqzx63PKcdDQvtYuYLqe2IsZVpTZ_-hDl85N7YwzJQGdxfR2uWLw/exec';

  const token = new URLSearchParams(window.location.search).get('t');
  let periodsCache = {};

  function show(id) {
    ['loadingBox','errorBox','mainBox'].forEach(x => document.getElementById(x).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function renderTable(tableEl, rows) {
    tableEl.innerHTML = '';
    if (!rows || rows.length === 0) {
      tableEl.innerHTML = '<tbody><tr><td class="text-muted p-3">此期別尚無資料</td></tr></tbody>';
      return;
    }
    const headers = Object.keys(rows[0]);
    let thead = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead>';
    let tbody = '<tbody>' + rows.map(r => '<tr>' + headers.map(h => `<td>${r[h] ?? ''}</td>`).join('') + '</tr>').join('') + '</tbody>';
    tableEl.innerHTML = thead + tbody;
  }

  async function loadPeriod(periodKey) {
    document.querySelectorAll('#periodTabs .nav-link').forEach(el => {
      el.classList.toggle('active', el.dataset.period === periodKey);
    });

    if (periodsCache[periodKey]) {
      renderTable(document.getElementById('summaryTable'), periodsCache[periodKey].summary);
      renderTable(document.getElementById('comparisonTable'), periodsCache[periodKey].evaluatorComparison);
      return;
    }

    document.getElementById('summaryTable').innerHTML = '<tbody><tr><td class="p-3">載入中...</td></tr></tbody>';
    document.getElementById('comparisonTable').innerHTML = '';

    const res = await fetch(`${API_URL}?action=getResults&token=${encodeURIComponent(token)}&period=${encodeURIComponent(periodKey)}`);
    const data = await res.json();
    if (data.error) {
      document.getElementById('summaryTable').innerHTML = `<tbody><tr><td class="text-danger p-3">${data.error}</td></tr></tbody>`;
      return;
    }
    periodsCache[periodKey] = data;
    renderTable(document.getElementById('summaryTable'), data.summary);
    renderTable(document.getElementById('comparisonTable'), data.evaluatorComparison);
  }

  async function init() {
    if (!token) { show('errorBox'); return; }
    try {
      const whoRes = await fetch(`${API_URL}?action=whoami&token=${encodeURIComponent(token)}`);
      const who = await whoRes.json();
      if (!who.valid || who.role !== 'admin') { show('errorBox'); return; }

      const periodsRes = await fetch(`${API_URL}?action=listPeriods&token=${encodeURIComponent(token)}`);
      const periodsData = await periodsRes.json();

      const tabsEl = document.getElementById('periodTabs');
      tabsEl.innerHTML = periodsData.periods.map((p, i) => `
        <li class="nav-item">
          <a class="nav-link ${i === 0 ? 'active' : ''}" href="#" data-period="${p.key}" onclick="loadPeriod('${p.key}'); return false;">${p.name}</a>
        </li>
      `).join('');

      show('mainBox');
      if (periodsData.periods.length > 0) loadPeriod(periodsData.periods[0].key);
    } catch (err) {
      show('errorBox');
    }
  }

  init();
</script>
</body>
</html>
